<div class="toast-stack" aria-live="polite">
  @for (item of notifications.notifications(); track item.id) {
    <div class="toast" [class.toast--error]="item.kind === 'error'" role="alert">
      <p class="toast__message">{{ item.message }}</p>
      <button type="button" class="toast__close" aria-label="Értesítés bezárása" (click)="notifications.dismiss(item.id)">×</button>
    </div>
  }
</div>
