# Runs the backend and frontend tests on pushes to main and on every pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run on the same ref cancels the older, superseded one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Unit tests and the Testcontainers (PostgreSQL 18) integration tests
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (test and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (build images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only checks that both images build; nothing is pushed
      - run: docker compose build
